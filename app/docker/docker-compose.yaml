services:
  moontvplus:
    image: ghcr.io/mtvpls/moontvplus:latest
    container_name: moontvplus
    restart: unless-stopped
    command: ["node", "/app/activation/start-with-activation.js"]
    ports:
      - "${TRIM_SERVICE_PORT:-3000}:3000"
    volumes:
      - ${TRIM_PKGVAR:?TRIM_PKGVAR not set}/data:/app/.data
      - ${TRIM_APPDEST}/docker/activation:/app/activation:ro
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SQLITE_DB_PATH=/app/.data/moontv.db
      - OFFLINE_DOWNLOAD_DIR=/app/.data/downloads
      - ACTIVATION_API_URL=https://9ay.kdns.fr
      - APP_PORT=${TRIM_SERVICE_PORT:-3000}
      - APP_DEVICE_NAME=${APP_DEVICE_NAME:-fnOS}
      - TZ=Asia/Shanghai

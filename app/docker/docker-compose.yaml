version: "3.8"

services:
  moontvplus:
    container_name: moontvplus
    image: ghcr.io/kaynai1/moontvplus-fpk:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${PKG_APPDATA}/data:/app/.data
      - ${PKG_APPDATA}/activation:/app/activation
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - SQLITE_DB_PATH=/app/.data/moontv.db
      - OFFLINE_DOWNLOAD_DIR=/data
      - ACTIVATION_API_URL=https://9ay.kdns.fr
      - TZ=Asia/Shanghai
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonTVPlus - 初始化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #4f7cff 0%, #7b4dff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
      padding: 40px;
      max-width: 520px;
      width: 100%;
    }

    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 26px; color: #33415c; margin-bottom: 6px; }
    .header p { color: #6b7280; font-size: 14px; }

    .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .step { width: 36px; height: 4px; background: #e5e7eb; border-radius: 2px; transition: background .3s; }
    .step.active { background: #4f7cff; }
    .step.completed { background: #10b981; }

    .form-section h3 {
      font-size: 16px; color: #1f2937; margin-bottom: 16px;
      padding-bottom: 8px; border-bottom: 2px solid #f3f4f6;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px; }
    .form-group label .required { color: #ef4444; margin-left: 4px; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb;
      border-radius: 8px; font-size: 15px; transition: border-color .2s;
    }
    .form-group input:focus { outline: none; border-color: #4f7cff; }
    .form-group input.invalid { border-color: #ef4444; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
    .error { font-size: 12px; color: #ef4444; margin-top: 6px; display: none; }
    .form-group input.invalid + .error { display: block; }

    .info-box {
      background: #eff6ff; border-left: 4px solid #3b82f6;
      padding: 12px 16px; border-radius: 4px; margin-bottom: 20px;
      font-size: 13px; color: #1e40af; line-height: 1.7;
    }

    .button-group { display: flex; gap: 12px; margin-top: 28px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .btn-primary { background: linear-gradient(135deg, #4f7cff 0%, #7b4dff 100%); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 124, 255, .35); }
    .btn-secondary { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .success { display: none; text-align: center; }
    .success.show { display: block; }
    .success h4 { color: #065f46; font-size: 20px; margin-bottom: 12px; }
    .success p { color: #047857; font-size: 14px; line-height: 1.8; }
    .success .big { font-size: 40px; margin-bottom: 12px; }

    @media (max-width: 480px) {
      .container { padding: 24px; }
      .header h1 { font-size: 22px; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MoonTVPlus</h1>
      <p>初始化向导</p>
    </div>

    <div class="step-indicator" id="steps">
      <div class="step active" id="step-1"></div>
      <div class="step" id="step-2"></div>
    </div>

    <div class="info-box" id="port-info">
      当前访问端口：<strong id="port-value">3000</strong><br>
      如需修改端口，请到「飞牛应用中心 → MoonTVPlus → 设置」调整。
    </div>

    <div class="success" id="success">
      <div class="big">✅</div>
      <h4>初始化完成</h4>
      <p id="success-text">应用正在启动，约 10 秒后本页面会自动刷新。</p>
    </div>

    <form id="config-form">
      <div class="form-section" id="section-1">
        <h3>管理员账号</h3>

        <div class="form-group">
          <label>管理员用户名 <span class="required">*</span></label>
          <input type="text" id="username" value="admin" autocomplete="username" required>
          <div class="hint">用于登录 MoonTVPlus 后台</div>
          <div class="error">请输入用户名</div>
        </div>

        <div class="form-group">
          <label>管理员密码 <span class="required">*</span></label>
          <input type="password" id="password" placeholder="至少 6 位" autocomplete="new-password" required>
          <div class="hint">请妥善保管，忘记后需修改容器内配置文件</div>
          <div class="error">密码至少 6 位</div>
        </div>

        <div class="form-group">
          <label>确认密码 <span class="required">*</span></label>
          <input type="password" id="password-confirm" placeholder="请再次输入密码" autocomplete="new-password" required>
          <div class="error">两次输入的密码不一致</div>
        </div>
      </div>

      <div class="form-section" id="section-2" style="display: none;">
        <h3>激活码</h3>

        <div class="form-group">
          <label>激活码 <span class="required">*</span></label>
          <input type="text" id="activation-code" placeholder="MTV-XXXX-XXXX-XXXX" autocomplete="off" required>
          <div class="hint">格式：MTV-XXXX-XXXX-XXXX，一个激活码绑定一台设备</div>
          <div class="error">请输入正确的激活码格式</div>
        </div>

        <div class="info-box">
          激活码由管理员发放，管理后台：<a href="https://9ay.kdns.fr" target="_blank" rel="noopener">9ay.kdns.fr</a>
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-secondary" id="btn-prev" style="display: none;">上一步</button>
        <button type="button" class="btn btn-primary" id="btn-next">下一步</button>
        <button type="submit" class="btn btn-primary" id="btn-submit" style="display: none;">完成初始化</button>
      </div>
    </form>
  </div>

  <script>
    const totalSteps = 2;
    let currentStep = 1;

    const form = document.getElementById('config-form');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSubmit = document.getElementById('btn-submit');

    function showStep(step) {
      for (let i = 1; i <= totalSteps; i++) {
        document.getElementById('section-' + i).style.display = i === step ? 'block' : 'none';
        document.getElementById('step-' + i).classList.toggle('active', i === step);
        document.getElementById('step-' + i).classList.toggle('completed', i < step);
      }
      btnPrev.style.display = step > 1 ? 'block' : 'none';
      btnNext.style.display = step < totalSteps ? 'block' : 'none';
      btnSubmit.style.display = step === totalSteps ? 'block' : 'none';
      currentStep = step;
    }

    function mark(id, bad) {
      document.getElementById(id).classList.toggle('invalid', bad);
    }

    function validateStep(step) {
      let valid = true;
      if (step === 1) {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const c = document.getElementById('password-confirm').value;
        mark('username', !u); if (!u) valid = false;
        mark('password', p.length < 6); if (p.length < 6) valid = false;
        mark('password-confirm', p !== c); if (p !== c) valid = false;
      }
      if (step === 2) {
        const code = document.getElementById('activation-code').value.trim();
        const ok = /^MTV-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$/.test(code);
        mark('activation-code', !ok); if (!ok) valid = false;
      }
      return valid;
    }

    async function submitConfig() {
      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        code: document.getElementById('activation-code').value.trim().toUpperCase()
      };

      btnSubmit.disabled = true;
      btnSubmit.textContent = '正在校验激活码...';

      try {
        const res = await fetch('/api/install/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.success) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = '完成初始化';
          alert(data.message || '初始化失败，请重试');
          return;
        }

        document.getElementById('steps').style.display = 'none';
        document.getElementById('port-info').style.display = 'none';
        form.style.display = 'none';
        document.getElementById('success').classList.add('show');
        setTimeout(() => window.location.reload(), 12000);
      } catch (err) {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '完成初始化';
        alert('无法连接应用，请稍后重试');
      }
    }

    btnNext.addEventListener('click', () => { if (validateStep(currentStep)) showStep(currentStep + 1); });
    btnPrev.addEventListener('click', () => showStep(currentStep - 1));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (validateStep(currentStep)) submitConfig();
    });

    ['username', 'password', 'password-confirm', 'activation-code'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => mark(id, false));
    });

    fetch('/api/status').then(r => r.json()).then(d => {
      if (d.port) document.getElementById('port-value').textContent = d.port;
    }).catch(() => {});

    showStep(1);
  </script>
</body>
</html>

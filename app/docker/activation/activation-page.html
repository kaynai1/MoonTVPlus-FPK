<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonTVPlus - 激活授权</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 32px;
      color: #667eea;
      margin-bottom: 8px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .status {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      border-left: 4px solid #667eea;
    }

    .status.activated {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .status.error {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .status h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .status p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    .status .code {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      background: #e5e7eb;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
      color: #374151;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      letter-spacing: 1px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group input::placeholder {
      color: #9ca3af;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: normal;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .help {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .help h4 {
      font-size: 14px;
      color: #374151;
      margin-bottom: 12px;
    }

    .help ul {
      list-style: none;
      font-size: 13px;
      color: #6b7280;
    }

    .help ul li {
      padding: 6px 0;
      padding-left: 20px;
      position: relative;
    }

    .help ul li:before {
      content: "•";
      position: absolute;
      left: 8px;
      color: #667eea;
    }

    .help a {
      color: #667eea;
      text-decoration: none;
    }

    .help a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #f0fdf4;
      color: #065f46;
      border: 1px solid #a7f3d0;
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px;
      }

      .logo h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🌙 MoonTVPlus</h1>
      <p>影视聚合平台 - 激活授权</p>
    </div>

    <div id="status" class="status">
      <h3>⚠️ 需要激活</h3>
      <p>本应用需要激活码才能使用。请输入您的激活码以继续。</p>
    </div>

    <div id="activated-status" class="status activated" style="display: none;">
      <h3>✅ 已激活</h3>
      <p>
        激活码：<span class="code" id="activated-code">-</span><br>
        激活时间：<span id="activated-time">-</span>
      </p>
    </div>

    <form id="activation-form">
      <div class="form-group">
        <label for="activation-code">激活码</label>
        <input
          type="text"
          id="activation-code"
          placeholder="例如：MTV-XXXX-XXXX-XXXX"
          autocomplete="off"
          required
        >
      </div>

      <button type="submit" class="btn" id="submit-btn">
        验证并激活
      </button>

      <div id="message" class="message"></div>
    </form>

    <div class="help">
      <h4> 如何获取激活码？</h4>
      <ul>
        <li>联系管理员获取激活码</li>
        <li>激活码格式：<code>MTV-XXXX-XXXX-XXXX</code></li>
        <li>每个激活码只能绑定一台设备</li>
        <li>
          管理后台：
          <a href="https://9ay.kdns.fr" target="_blank">9ay.kdns.fr</a>
        </li>
      </ul>
    </div>
  </div>

  <script>
    const form = document.getElementById('activation-form');
    const codeInput = document.getElementById('activation-code');
    const submitBtn = document.getElementById('submit-btn');
    const messageDiv = document.getElementById('message');
    const statusDiv = document.getElementById('status');
    const activatedStatusDiv = document.getElementById('activated-status');

    // Check activation status on load
    async function checkStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        if (data.activated) {
          showActivated(data);
        }
      } catch (err) {
        console.error('Failed to check status:', err);
      }
    }

    function showActivated(data) {
      statusDiv.style.display = 'none';
      form.style.display = 'none';
      activatedStatusDiv.style.display = 'block';
      document.getElementById('activated-code').textContent = data.code;
      document.getElementById('activated-time').textContent = new Date(data.activatedAt).toLocaleString('zh-CN');
    }

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
    }

    function hideMessage() {
      messageDiv.className = 'message';
      messageDiv.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const code = codeInput.value.trim();

      if (!code) {
        showMessage('请输入激活码', 'error');
        return;
      }

      // Disable button and show loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>验证中...';
      hideMessage();

      try {
        const response = await fetch('/api/activate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ code }),
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'success');

          // Update status after a short delay
          setTimeout(() => {
            showActivated({
              code: code,
              activatedAt: new Date().toISOString(),
            });
          }, 1500);
        } else {
          showMessage(data.message || '激活失败，请检查激活码', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请稍后重试', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '验证并激活';
      }
    });

    // Check status on page load
    checkStatus();
  </script>
</body>
</html>

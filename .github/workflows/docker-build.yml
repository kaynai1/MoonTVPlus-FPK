name: Build and Release FPK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Clone MoonTVPlus source
        run: |
          cd app/docker
          git clone --depth 1 https://github.com/mtvpls/MoonTVPlus.git src
          cp -r src/* .
          rm -rf src

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-fpk-online:
    needs: build-docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          wget https://developer.fnnas.com/downloads/fnpack-1.2.3-linux-amd64.tar.gz
          tar -xzf fnpack-1.2.3-linux-amd64.tar.gz
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/
          fnpack --version

      - name: Build Online FPK
        run: |
          cd moontvplus-fpk-ghcr
          fnpack build
          ls -lh *.fpk

      - name: Upload Online FPK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: moontvplus-fpk-ghcr/moontvplus.fpk
          name: "MoonTVPlus v${{ github.ref_name }}"
          body: |
            ## MoonTVPlus FPK 包

            ### 在线版（推荐）
            - 文件小（< 10MB）
            - 安装时从 GitHub 拉取镜像
            - 适合网络良好的环境

            ### 安装步骤
            1. 下载 moontvplus.fpk
            2. 打开 fnOS 应用中心
            3. 点击「手动安装」
            4. 上传 FPK 文件
            5. 访问 http://你的IP:3000 完成配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-fpk-offline:
    needs: build-docker
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          wget https://developer.fnnas.com/downloads/fnpack-1.2.3-linux-amd64.tar.gz
          tar -xzf fnpack-1.2.3-linux-amd64.tar.gz
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/
          fnpack --version

      - name: Clone MoonTVPlus source
        run: |
          cd moontvplus-fpk-embedded/app/docker
          git clone --depth 1 https://github.com/mtvpls/MoonTVPlus.git src
          cp -r src/* .
          rm -rf src

      - name: Build Docker Image
        run: |
          cd moontvplus-fpk-embedded/app/docker
          docker build -t moontvplus-fpk:offline .

      - name: Export Docker Image
        run: |
          cd moontvplus-fpk-embedded/app/docker
          docker save moontvplus-fpk:offline -o ../moontvplus-image.tar
          ls -lh ../moontvplus-image.tar

      - name: Build Offline FPK
        run: |
          cd moontvplus-fpk-embedded
          cp app/docker/moontvplus-image.tar ./moontvplus-image.tar
          fnpack build
          ls -lh *.fpk

      - name: Upload Offline FPK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: moontvplus-fpk-embedded/moontvplus.fpk
          name: "MoonTVPlus v${{ github.ref_name }}"
          body: |
            ## MoonTVPlus FPK 包

            ### 离线版
            - 文件大（约 800MB）
            - 镜像已内嵌，无需网络
            - 适合离线环境或网络受限

            ### 安装步骤
            1. 下载 moontvplus.fpk
            2. 打开 fnOS 应用中心
            3. 点击「手动安装」
            4. 上传 FPK 文件
            5. 访问 http://你的IP:3000 完成配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

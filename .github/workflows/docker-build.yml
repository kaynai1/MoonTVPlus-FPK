name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Clone MoonTVPlus source
        run: |
          git clone --depth 1 https://github.com/mtvpls/MoonTVPlus.git ./app/docker/moontvplus-src
          cp -r ./app/docker/moontvplus-src/* ./app/docker/
          rm -rf ./app/docker/moontvplus-src

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-fpk:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fnpack
        run: |
          wget https://github.com/ckcoding/fnpack/releases/latest/download/fnpack-linux-amd64 -O fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/

      - name: Build FPK package
        run: |
          cd moontvplus-fpk-ghcr
          fnpack build

      - name: Upload FPK to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: moontvplus-fpk-ghcr/moontvplus.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

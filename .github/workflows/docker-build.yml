name: Build FPK Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kaynai1/moontvplus-fpk

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          git clone --depth 1 https://github.com/mtvpls/MoonTVPlus.git /tmp/src
          cp app/docker/Dockerfile /tmp/src/Dockerfile
          cp app/docker/.dockerignore /tmp/src/.dockerignore
          rm -rf /tmp/src/activation
          cp -r app/docker/activation /tmp/src/activation

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/src
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk-online:
    needs: build-docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build online FPK
        run: |
          bash build-fpk.sh online
          ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moontvplus_*_online.fpk
          fail_on_unmatched_files: true

  fpk-offline:
    needs: build-docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag image
        run: |
          docker pull ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:embedded

      - name: Export image
        run: |
          docker save ${{ env.IMAGE }}:embedded -o moontvplus-image.tar
          ls -lh moontvplus-image.tar

      - name: Build offline FPK
        run: |
          bash build-fpk.sh offline
          ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moontvplus_*_offline.fpk
          fail_on_unmatched_files: true

  release-notes:
    needs: [ fpk-online, fpk-offline ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Write release notes
        uses: softprops/action-gh-release@v2
        with:
          name: MoonTVPlus FPK ${{ github.ref_name }}
          body: |
            ## 下载哪个？

            | 文件 | 大小 | 适用场景 |
            | --- | --- | --- |
            | `moontvplus_*_online.fpk` | 约 200 KB | **推荐**。安装时从 GHCR 拉取镜像，需要 NAS 能联网 |
            | `moontvplus_*_offline.fpk` | 约 500 MB+ | 镜像已内嵌，安装过程完全离线，适合无法访问 GHCR 的环境 |

            ## 安装步骤

            1. 在飞牛 OS 中打开「应用中心 → 手动安装」，选择下载的 `.fpk` 文件
            2. 安装向导中填写访问端口（默认 3000）
            3. 安装完成后打开应用，首次访问会进入初始化页面：
               - 设置管理员用户名与密码（即 MoonTVPlus 站长账号）
               - 输入激活码 `MTV-XXXX-XXXX-XXXX`
            4. 初始化完成约 10 秒后应用自动就绪

            ## 说明

            - 一个激活码只能绑定一台设备；换设备请在管理后台解绑
            - 激活码管理后台：https://9ay.kdns.fr
            - 升级/卸载不会删除数据（`data` 目录保留在应用数据目录中）

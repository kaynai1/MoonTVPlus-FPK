name: Build FPK Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mtvpls/moontvplus

jobs:
  fpk-online:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Build online FPK
        run: |
          bash build-fpk.sh online
          ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moontvplus_*_online.fpk
          fail_on_unmatched_files: true

  fpk-offline:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Pull official image
        run: |
          docker pull ${{ env.IMAGE }}:latest
          docker image inspect ${{ env.IMAGE }}:latest --format '{{.Size}} bytes'

      - name: Export image
        run: |
          docker save ${{ env.IMAGE }}:latest -o moontvplus-image.tar
          ls -lh moontvplus-image.tar

      - name: Build offline FPK
        run: |
          bash build-fpk.sh offline
          ls -lh dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/moontvplus_*_offline.fpk
          fail_on_unmatched_files: true

  release-notes:
    needs: [ fpk-online, fpk-offline ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Write release notes
        uses: softprops/action-gh-release@v2
        with:
          name: MoonTVPlus FPK ${{ github.ref_name }}
          body: |
            ## 下载哪个？

            | 文件 | 大小 | 适用场景 |
            | --- | --- | --- |
            | `moontvplus_*_online.fpk` | 约 200 KB（另需拉取 307 MB 镜像） | **推荐**。安装时从 GHCR 拉取官方镜像，会自动尝试国内镜像源 |
            | `moontvplus_*_offline.fpk` | 约 300 MB | 镜像已内嵌，安装过程完全离线 |

            ## 安装步骤

            1. 在飞牛 OS 中打开「应用中心 → 手动安装」，选择下载的 `.fpk` 文件
            2. 安装向导中填写访问端口（默认 3000）
            3. 安装完成后打开应用，首次访问会进入初始化页面：
               - 设置管理员用户名与密码（即 MoonTVPlus 站长账号）
               - 输入激活码 `MTV-XXXX-XXXX-XXXX`
            4. 初始化完成约 10 秒后应用自动就绪

            ## 说明

            - 使用官方镜像 `ghcr.io/mtvpls/moontvplus:latest`，激活层通过挂载方式叠加，不修改上游镜像
            - 在线版拉取失败时依次尝试 `ghcr.nju.edu.cn`、`ghcr.m.daocloud.io`，最后回退 `ghcr.io`
            - 一个激活码只能绑定一台设备；换设备请在管理后台解绑
            - 激活码管理后台：https://9ay.kdns.fr
            - 升级/卸载不会删除数据（`data` 目录保留在应用数据目录中）
